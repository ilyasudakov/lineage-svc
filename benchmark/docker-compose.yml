# Side-by-side benchmark stack: data-lineage + Marquez, each with their own
# Postgres, both scraped by a single Prometheus, visualized in Grafana.
#
# Resource limits match across both services so the comparison is fair.

x-pg-limits: &pg-limits
  deploy:
    resources:
      limits:
        cpus: "4"
        memory: 4G

services:
  # ---------- data-lineage stack ----------
  lineage-pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lineage
      POSTGRES_PASSWORD: lineage
      POSTGRES_DB: lineage
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineage"]
      interval: 5s
      timeout: 3s
      retries: 10
    <<: *pg-limits

  data-lineage:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATA_LINEAGE_DATABASE_URL: postgresql+asyncpg://lineage:lineage@lineage-pg:5432/lineage
    depends_on:
      lineage-pg:
        condition: service_healthy
    ports: ["8000:8000"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  postgres-exporter-lineage:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://lineage:lineage@lineage-pg:5432/lineage?sslmode=disable"
    depends_on: [lineage-pg]
    ports: ["9187:9187"]

  # ---------- Marquez stack ----------
  marquez-pg:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez"]
      interval: 5s
      timeout: 3s
      retries: 10
    <<: *pg-limits

  marquez:
    image: marquezproject/marquez:0.50.0
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: marquez-pg
      POSTGRES_PORT: "5432"
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    depends_on:
      marquez-pg:
        condition: service_healthy
    ports: ["5000:5000", "5001:5001"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  postgres-exporter-marquez:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://marquez:marquez@marquez-pg:5432/marquez?sslmode=disable"
    depends_on: [marquez-pg]
    ports: ["9188:9187"]

  # ---------- Observability ----------
  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"  # k6 prometheus-rw output

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
